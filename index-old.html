<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Transportadoras</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .filtros {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    .filtros label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #667eea;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .card h3 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.5em;
    }

    .info-row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      color: #555;
    }

    .info-row strong {
      min-width: 80px;
      color: #333;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25D366;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .whatsapp-btn:hover {
      background: #1ebd59;
    }

    .whatsapp-icon {
      width: 20px;
      height: 20px;
    }

    .cidades-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .cidades-section strong {
      display: block;
      margin-bottom: 10px;
      color: #333;
    }

    .cidades-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
    }

    .cidades-list li {
      background: #f0f0f0;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 14px;
      color: #555;
    }

    .no-results {
      text-align: center;
      color: white;
      font-size: 1.2em;
      padding: 40px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8em;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🚚 Transportadoras</h1>

  <div class="filtros">
    <label for="filtroTransportadora">Selecione uma transportadora:</label>
    <select id="filtroTransportadora">
      <option value="todas">Todas as transportadoras</option>
    </select>

    <label for="filtroCidade">Filtrar por cidade:</label>
    <input
      type="text"
      id="filtroCidade"
      placeholder="Digite o nome da cidade..."
    />
  </div>

  <div id="resultado"></div>
</div>

<script src="data.js"></script>
<script>
  const filtroTransportadora = document.getElementById("filtroTransportadora");
  const filtroCidade = document.getElementById("filtroCidade");
  const resultado = document.getElementById("resultado");

  // Popula o dropdown de transportadoras
  transportadoras.forEach((transportadora, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = transportadora.nome;
    filtroTransportadora.appendChild(option);
  });

  // Formata telefone para WhatsApp (remove caracteres especiais)
  function formatarTelefoneWhatsApp(telefone) {
    const numeroLimpo = telefone.replace(/\D/g, '');
    // Adiciona código do país se não tiver
    return numeroLimpo.startsWith('55') ? numeroLimpo : '55' + numeroLimpo;
  }

  // Renderiza os cards de transportadoras
  function renderizar() {
    resultado.innerHTML = "";
    
    const buscaCidade = normalizar(filtroCidade.value);
    let resultadosEncontrados = 0;

    transportadoras.forEach((transportadora, index) => {
      // Filtro por transportadora selecionada
      if (
        filtroTransportadora.value !== "todas" &&
        Number(filtroTransportadora.value) !== index
      ) {
        return;
      }

      // Filtro por cidade
      let cidadesFiltradas = transportadora.cidades;
      let cidadeSelecionada = null;

      if (buscaCidade) {
        cidadesFiltradas = transportadora.cidades.filter(cidade =>
          normalizar(cidade).includes(buscaCidade)
        );

        // Se não encontrou nenhuma cidade, não mostra a transportadora
        if (cidadesFiltradas.length === 0) {
          return;
        }

        // Pega a primeira cidade encontrada para cálculos
        cidadeSelecionada = cidadesFiltradas[0];
      }

      resultadosEncontrados++;

      // Calcula frete e prazo (corrigido para passar a cidade correta)
      const frete = cidadeSelecionada 
        ? transportadora.calcularFrete(cidadeSelecionada)
        : transportadora.calcularFrete();
      
      const prazo = cidadeSelecionada
        ? transportadora.calcularPrazo(cidadeSelecionada)
        : transportadora.calcularPrazo();

      // Cria o card
      const card = document.createElement("div");
      card.className = "card";

      const whatsappNumber = formatarTelefoneWhatsApp(transportadora.telefone);
      const mensagem = encodeURIComponent(
        `Olá! Gostaria de solicitar um frete com a ${transportadora.nome}.`
      );

      card.innerHTML = `
        <h3>${transportadora.nome}</h3>
        
        <div class="info-row">
          <strong>📞 Telefone:</strong> ${transportadora.telefone}
        </div>
        
        <div class="info-row">
          <strong>💰 Frete:</strong> ${frete}
        </div>
        
        <div class="info-row">
          <strong>⏱️ Prazo:</strong> ${prazo}
        </div>

        <a 
          href="https://wa.me/${whatsappNumber}?text=${mensagem}" 
          target="_blank" 
          class="whatsapp-btn"
        >
          <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          Chamar no WhatsApp
        </a>

        <div class="cidades-section">
          <strong>Cidades atendidas (${cidadesFiltradas.length}):</strong>
          <ul class="cidades-list">
            ${cidadesFiltradas.map(cidade => `<li>${cidade}</li>`).join("")}
          </ul>
        </div>
      `;

      resultado.appendChild(card);
    });

    // Mostra mensagem se não encontrou resultados
    if (resultadosEncontrados === 0) {
      resultado.innerHTML = `
        <div class="no-results">
          Nenhuma transportadora encontrada para "${filtroCidade.value}"
        </div>
      `;
    }
  }

  // Event listeners
  filtroTransportadora.addEventListener("change", renderizar);
  filtroCidade.addEventListener("input", renderizar);

  // Renderiza inicial
  renderizar();
</script>

</body>
</html>
