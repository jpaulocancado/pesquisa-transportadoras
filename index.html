<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Transportadoras</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
  <h1>🚚 Transportadoras</h1>

  <div class="header-actions">
    <a href="admin.html" class="admin-btn">⚙️ Painel Administrativo</a>
  </div>

  <!-- Seção de Busca por Cidade -->
  <div class="busca-cidade-section">
    <h2>🔍 Procurar Transportadoras por Cidade</h2>
    <div class="busca-container">
      <input
        type="text"
        id="buscaCidade"
        placeholder="Digite o nome da cidade..."
        autocomplete="off"
      />
      <div id="sugestoesCidades" class="sugestoes-dropdown"></div>
    </div>
    <div id="resultadoBusca" class="resultado-busca"></div>
  </div>

  <div class="divider"></div>

  <!-- Filtros Avançados -->
  <details class="filtros-avancados">
    <summary>Filtros Avançados</summary>
    <div class="filtros">
      <label for="filtroTransportadora">Selecione uma transportadora:</label>
      <select id="filtroTransportadora">
        <option value="todas">Todas as transportadoras</option>
      </select>

      <label for="filtroCidade">Filtrar por cidade:</label>
      <input
        type="text"
        id="filtroCidade"
        placeholder="Digite o nome da cidade..."
      />
    </div>
  </details>

  <div id="resultado"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
